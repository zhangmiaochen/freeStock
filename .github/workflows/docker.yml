name: Docker 镜像（多架构）

# 触发策略（对应 docs/gitflow.md 的分支模型）：
#   - push 到 main / master  → 构建并推送 :latest 与 :edge
#   - push 形如 v1.2.3 的 tag → 构建并推送 :1.2.3、:1.2、:latest
#   - PR                      → 只构建验证，不推送（不污染镜像仓库）
#   - 手动触发                → 便于排查
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免排队积压
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像名统一走 GHCR（GitHub Container Registry）。
  # 如需 Docker Hub，把 REGISTRY 改成 docker.io 并额外加 DOCKERHUB_* secrets。
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（交叉构建 arm64 必需）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        # PR 来自 fork 时 secrets 不可用，且本来也不推送，直接跳过
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名（GHCR 要求全小写）
        id: image
        run: |
          # github.repository 可能含大写（例如 FreeStock），
          # GHCR 拒绝大写仓库名，这里统一转小写。
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 仓库名统一小写（GHCR 要求）
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=FreeStock
            org.opencontainers.image.description=A 股本地量化数据工具（server 模式）
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 群晖/威联通的主流机型覆盖 amd64 与 arm64
          platforms: linux/amd64,linux/arm64
          # PR 只验证构建，不推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 分层缓存：前端依赖层与 go mod 层都能复用，第二次构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=1.26
            NODE_VERSION=22
            PNPM_VERSION=12
            # 可选：把 cne 打进镜像。默认空 = 不打（推荐运行期装进 /data，见文档）
            # 在仓库 Settings → Variables 里设 CNE_PIP_SPEC 即可生效。
            CNE_PIP_SPEC=${{ vars.CNE_PIP_SPEC }}

      - name: 输出摘要
        run: |
          {
            echo "### Docker 镜像构建完成"
            echo ""
            echo "- 事件：\`${{ github.event_name }}\`"
            echo "- 引用：\`${{ github.ref }}\`"
            echo "- 架构：linux/amd64, linux/arm64"
            echo "- 推送：\`${{ github.event_name != 'pull_request' }}\`"
            echo ""
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
