name: Docker 镜像（多架构）

# 触发策略（对应 docs/gitflow.md 的分支模型）：
#   - push 到 main / master  → 构建并推送 :latest 与 :edge
#   - push 形如 v1.2.3 的 tag → 构建并推送 :1.2.3、:1.2、:latest
#   - PR                      → 只构建验证，不推送（不污染镜像仓库）
#   - 手动触发                → 便于排查
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免排队积压
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像名统一走 GHCR（GitHub Container Registry）。
  # 如需 Docker Hub，把 REGISTRY 改成 docker.io 并额外加 DOCKERHUB_* secrets。
  REGISTRY: ghcr.io

jobs:
  build:
    name: 构建 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub 凭据是**可选**的：配了就用它登录（避免匿名拉取被拒），
      # 没配这两个 secret 时值为空，下面那步会自动跳过。
      #
      # ⚠ 放 job 级 env 而不是写在 step 的 if 里：GitHub 的 step `if`
      # **不允许使用 secrets 上下文**，只能通过 env 间接判断。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（交叉构建 arm64 必需）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        # PR 来自 fork 时 secrets 不可用，且本来也不推送，直接跳过
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选但**强烈建议**：登录 Docker Hub，避免匿名拉取被拒。
      #
      # 失败长这样（只在"构建并推送"这一步，且和代码无关）：
      #   failed to build: failed to solve: failed to fetch oauth token: denied: denied
      # 原因：基础镜像（node / golang / debian）都在 Docker Hub，共享 runner 的
      # 匿名拉取配额会被拒/抖动；同一份 Dockerfile 上一次能成功、下一次就失败。
      #
      # 配法：仓库 Settings → Secrets 里加 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      # （Token 用 Docker Hub 的 Access Token，只读权限即可）。
      # **没配就自动跳过**，不会因为缺 secret 而失败。
      - name: 登录 Docker Hub（可选，配了 secrets 才生效）
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 计算构建戳（提交号 + UTC 时间）
        id: stamp
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 计算镜像名（GHCR 要求全小写）
        id: image
        run: |
          # github.repository 可能含大写（例如 FreeStock），
          # GHCR 拒绝大写仓库名，这里统一转小写。
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 仓库名统一小写（GHCR 要求）
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=FreeStock
            org.opencontainers.image.description=A 股本地量化数据工具（server 模式）
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送
        id: build
        # 拉基础镜像被 registry 拒绝/抖动是**偶发**的（同样的 Dockerfile 这次成功、
        # 下次 denied）。别让它把一次正常的发布打成红叉：这里失败后重试一次。
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 群晖/威联通的主流机型覆盖 amd64 与 arm64
          platforms: linux/amd64,linux/arm64
          # PR 只验证构建，不推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 分层缓存：前端依赖层与 go mod 层都能复用，第二次构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=1.26
            NODE_VERSION=22
            PNPM_VERSION=12
            # 可选：把 cne 打进镜像。默认空 = 不打（推荐运行期装进 /data，见文档）
            # 在仓库 Settings → Variables 里设 CNE_PIP_SPEC 即可生效。
            CNE_PIP_SPEC=${{ vars.CNE_PIP_SPEC }}
            GIT_SHA=${{ steps.stamp.outputs.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}

      - name: 构建并推送（首次失败后重试一次）
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GO_VERSION=1.26
            NODE_VERSION=22
            PNPM_VERSION=12
            CNE_PIP_SPEC=${{ vars.CNE_PIP_SPEC }}
            GIT_SHA=${{ steps.stamp.outputs.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}

      - name: 输出摘要
        if: always()
        run: |
          {
            echo "### Docker 镜像构建完成"
            echo ""
            echo "- 事件：\`${{ github.event_name }}\`"
            echo "- 引用：\`${{ github.ref }}\`"
            echo "- 架构：linux/amd64, linux/arm64"
            echo "- 推送：\`${{ github.event_name != 'pull_request' }}\`"
            echo ""
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
